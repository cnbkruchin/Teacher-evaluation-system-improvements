<style>
/* ============================================================
   ระบบประเมินผลการปฏิบัติงานครู — ชุดรูปแบบหน้าจอ
   ออกแบบให้เต็มหน้าจอและปรับตามอุปกรณ์: มือถือ → แท็บเล็ต → คอมพิวเตอร์
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

:root {
  /* สี */
  --brand-50:#eef2ff; --brand-100:#e0e7ff; --brand-200:#c7d2fe; --brand-400:#818cf8;
  --brand-500:#6366f1; --brand-600:#4f46e5; --brand-700:#4338ca; --brand-800:#3730a3; --brand-900:#312e81;
  --teal:#0d9488; --teal-soft:#ccfbf1;
  --ok:#16a34a; --ok-soft:#dcfce7;
  --warn:#d97706; --warn-soft:#fef3c7;
  --danger:#dc2626; --danger-soft:#fee2e2;
  --info:#0284c7; --info-soft:#e0f2fe;

  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f9fafb; --surface-3:#f1f5f9;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --border:#e2e8f0; --border-2:#cbd5e1;
  --sidebar-bg:linear-gradient(175deg,#312e81 0%,#4338ca 60%,#4f46e5 100%);

  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 4px 16px rgba(15,23,42,.08);
  --shadow-lg:0 16px 48px rgba(15,23,42,.18);

  /* ระยะและขนาดแบบยืดหยุ่นตามความกว้างจอ */
  --gap:clamp(10px, 1.1vw, 18px);
  --pad:clamp(14px, 1.6vw, 26px);
  --card-pad:clamp(15px, 1.5vw, 22px);
  --fs-base:clamp(13.5px, .95vw, 15px);
  --fs-sm:clamp(11.5px, .8vw, 12.5px);
  --fs-lg:clamp(15px, 1.15vw, 17px);
  --fs-title:clamp(16px, 1.4vw, 20px);
  --fs-stat:clamp(22px, 2.2vw, 32px);

  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --sidebar-w:clamp(210px, 15vw, 260px);
  --tap:44px;                        /* ขนาดพื้นที่กดขั้นต่ำบนจอสัมผัส */
  --safe-b:env(safe-area-inset-bottom, 0px);
  --topbar-h:56px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

html[data-theme="dark"] {
  --bg:#0b1120; --surface:#131c31; --surface-2:#1a2439; --surface-3:#243049;
  --text:#e6ecf7; --text-2:#a8b6cc; --text-3:#6b7c99;
  --border:#26324a; --border-2:#33415c;
  --brand-50:#1e1b4b; --brand-100:#272264; --brand-200:#312e81;
  --sidebar-bg:linear-gradient(175deg,#0e1530 0%,#1b1f4d 60%,#25236b 100%);
  --ok-soft:#0d3b23; --warn-soft:#432c06; --danger-soft:#450d0d; --info-soft:#0a2b42; --teal-soft:#0a3b36;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 16px rgba(0,0,0,.45);
  --shadow-lg:0 16px 48px rgba(0,0,0,.65);
}

* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
html, body { height:100%; }
body {
  font-family:'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background:var(--bg); color:var(--text); font-size:var(--fs-base); line-height:1.6;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
a { color:var(--brand-600); text-decoration:none; }
:focus-visible { outline:2px solid var(--brand-500); outline-offset:2px; border-radius:6px; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:8px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-3); }
::-webkit-scrollbar-track { background:transparent; }
@media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

/* ============ โครงหน้าจอ: เต็มหน้าจอเสมอ เลื่อนเฉพาะส่วนเนื้อหา ============ */
.app {
  display:grid;
  grid-template-columns:var(--sidebar-w) minmax(0, 1fr);
  height:100vh; height:100dvh;
  overflow:hidden;
}
.sidebar {
  background:var(--sidebar-bg); color:#fff;
  display:flex; flex-direction:column; min-height:0; z-index:60;
  transition:transform .26s var(--ease), width .26s var(--ease);
}
.sidebar__brand { padding:16px 16px 14px; border-bottom:1px solid rgba(255,255,255,.14); flex-shrink:0; }
.sidebar__brand .logo { display:flex; align-items:center; gap:10px; min-width:0; }
.sidebar__brand .logo-mark {
  width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.16);
  display:grid; place-items:center; font-size:20px; flex-shrink:0;
}
.sidebar__brand h1 { font-size:14px; font-weight:700; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar__brand p { font-size:11px; opacity:.72; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar__nav { padding:10px; overflow-y:auto; overflow-x:hidden; flex:1; min-height:0; scrollbar-width:thin; }
.sidebar__nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); }
.sidebar__nav .group {
  font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  opacity:.55; padding:14px 12px 6px; font-weight:600; white-space:nowrap;
}
.navlink {
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; cursor:pointer;
  color:rgba(255,255,255,.84); font-size:13.5px; font-weight:500; transition:background .16s, color .16s;
  margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
  font-family:inherit; min-height:40px;
}
.navlink .ico { width:22px; text-align:center; font-size:16px; flex-shrink:0; }
.navlink .txt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.navlink:hover { background:rgba(255,255,255,.12); color:#fff; }
.navlink.active { background:#fff; color:var(--brand-800); font-weight:600; box-shadow:var(--shadow-sm); }
.sidebar__foot { padding:11px 14px calc(11px + var(--safe-b)); border-top:1px solid rgba(255,255,255,.14);
  font-size:11px; opacity:.75; flex-shrink:0; }
.sidebar__foot div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.main { display:flex; flex-direction:column; min-width:0; min-height:0; }
.topbar {
  display:flex; align-items:center; gap:10px; flex-wrap:nowrap;
  padding:9px var(--pad); min-height:var(--topbar-h); flex-shrink:0;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--border); z-index:50;
}
.topbar h2 { font-size:var(--fs-title); font-weight:700; display:flex; align-items:center; gap:8px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.topbar .spacer { flex:1 1 auto; min-width:0; }
.content {
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:var(--pad); padding-bottom:calc(var(--pad) + var(--safe-b));
  scroll-behavior:smooth; overscroll-behavior:contain;
}
.content > * { max-width:1500px; margin-left:auto; margin-right:auto; }
.content-narrow { max-width:920px !important; }

/* ปุ่มเปิดเมนู (แสดงเฉพาะจอเล็ก) และฉากหลังของลิ้นชักเมนู
   ใช้ .topbar นำหน้าเพื่อให้ชนะกฎของ .btn ที่ประกาศทีหลัง */
.topbar .menu-toggle { display:none; }
.drawer-backdrop {
  position:fixed; inset:0; background:rgba(2,6,23,.55); backdrop-filter:blur(2px);
  z-index:55; opacity:0; pointer-events:none; transition:opacity .22s var(--ease);
}
.drawer-backdrop.show { opacity:1; pointer-events:auto; }
.bottomnav { display:none; }

/* ============ การ์ดและตาราง grid ============ */
.card {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); padding:var(--card-pad); margin-bottom:var(--gap);
}
.card__head { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card__head h3 { font-size:var(--fs-lg); font-weight:700; display:flex; align-items:center; gap:8px; }
.card__head .spacer { flex:1; }
.card__desc { font-size:var(--fs-sm); color:var(--text-2); margin-top:-6px; margin-bottom:12px; line-height:1.55; }

.grid { display:grid; gap:var(--gap); }
.grid-2 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid-3 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.grid-4 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 168px), 1fr)); }
.grid-5 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

/* ============ สถิติ ============ */
.stat {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
}
.stat:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
.stat::after { content:''; position:absolute; inset:0 auto 0 0; width:4px; background:var(--brand-600); }
.stat.c2::after { background:var(--ok); } .stat.c3::after { background:var(--warn); }
.stat.c4::after { background:var(--teal); } .stat.c5::after { background:var(--danger); }
.stat .label { font-size:var(--fs-sm); color:var(--text-2); font-weight:500; }
.stat .value { font-size:var(--fs-stat); font-weight:700; line-height:1.2; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; }
.stat .hint { font-size:11px; color:var(--text-3); }

/* ============ ปุ่ม ============ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 16px; min-height:38px; border-radius:var(--radius-sm); border:1px solid transparent;
  cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; white-space:nowrap;
  background:var(--brand-600); color:#fff; transition:background .16s, transform .12s var(--ease), box-shadow .16s;
}
.btn:hover:not(:disabled) { background:var(--brand-700); transform:translateY(-1px); box-shadow:var(--shadow); }
.btn:active:not(:disabled) { transform:translateY(0); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn--ghost { background:transparent; color:var(--text-2); border-color:var(--border-2); }
.btn--ghost:hover:not(:disabled) { background:var(--surface-3); color:var(--text); box-shadow:none; }
.btn--soft { background:var(--brand-50); color:var(--brand-700); }
.btn--soft:hover:not(:disabled) { background:var(--brand-100); }
.btn--ok { background:var(--ok); } .btn--ok:hover:not(:disabled) { background:#15803d; }
.btn--warn { background:var(--warn); } .btn--warn:hover:not(:disabled) { background:#b45309; }
.btn--danger { background:var(--danger); } .btn--danger:hover:not(:disabled) { background:#b91c1c; }
.btn--sm { padding:5px 11px; min-height:32px; font-size:12px; border-radius:8px; }
.btn--lg { padding:13px 24px; min-height:48px; font-size:15px; }
.btn--block { width:100%; }
.btn-row { display:flex; gap:7px; flex-wrap:wrap; }
.icon-btn {
  background:none; border:none; cursor:pointer; font-size:17px; color:var(--text-3);
  padding:4px 8px; border-radius:8px; min-width:32px; min-height:32px; transition:.15s;
}
.icon-btn:hover { background:var(--surface-3); color:var(--text); }

/* ============ ฟอร์ม ============ */
.field { margin-bottom:13px; }
.field label, .label { display:block; font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:5px; }
.input, input[type=text], input[type=password], input[type=email], input[type=number], input[type=time],
select, textarea {
  width:100%; padding:10px 13px; min-height:42px;
  border:1.5px solid var(--border); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--text); font-family:inherit; font-size:14px;
  transition:border-color .16s, box-shadow .16s;
}
select { cursor:pointer; appearance:none; padding-right:34px;
  background-image:linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
                   linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }
input:focus, select:focus, textarea:focus {
  outline:none; border-color:var(--brand-500); box-shadow:0 0 0 3px var(--brand-100);
}
textarea { resize:vertical; min-height:82px; line-height:1.6; }
input:disabled, select:disabled, textarea:disabled {
  background:var(--surface-3); color:var(--text-3); cursor:not-allowed; opacity:.75;
}
.hint { font-size:11.5px; color:var(--text-3); margin-top:5px; line-height:1.5; }
.inline { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.checkbox { display:flex; align-items:flex-start; gap:9px; cursor:pointer; font-size:13px; padding:8px 0; }
.checkbox input { width:18px; height:18px; margin-top:2px; accent-color:var(--brand-600); cursor:pointer; flex-shrink:0; }
.switch-row { display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:11px 0; border-bottom:1px dashed var(--border); }
.switch-row:last-child { border-bottom:none; }
.switch-row .t { font-size:13px; font-weight:600; }
.switch-row .d { font-size:11.5px; color:var(--text-3); }
.switch-row input[type=checkbox] { width:20px; height:20px; accent-color:var(--brand-600); flex-shrink:0; }
.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.filters .field { margin:0; min-width:130px; flex:0 1 auto; }

/* ============ ตาราง ============ */
.table-wrap {
  overflow-x:auto; overflow-y:visible; border-radius:var(--radius-sm); border:1px solid var(--border);
  -webkit-overflow-scrolling:touch; position:relative;
}
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th {
  background:var(--surface-3); padding:10px 12px; text-align:left; font-weight:600; font-size:12px;
  color:var(--text-2); border-bottom:1px solid var(--border); white-space:nowrap;
  position:sticky; top:0; z-index:2;
}
tbody td { padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr { transition:background .12s; }
tbody tr:hover td { background:var(--surface-2); }
td.num, th.num { text-align:center; font-variant-numeric:tabular-nums; }
.table-empty { text-align:center; color:var(--text-3); padding:36px 12px; }
.scroll-y { max-height:min(60vh, 560px); overflow-y:auto; }

/* ============ ป้ายสถานะ ============ */
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px;
  font-size:11.5px; font-weight:600; white-space:nowrap; }
.badge--ok { background:var(--ok-soft); color:var(--ok); }
.badge--info { background:var(--info-soft); color:var(--info); }
.badge--warn { background:var(--warn-soft); color:var(--warn); }
.badge--danger { background:var(--danger-soft); color:var(--danger); }
.badge--muted { background:var(--surface-3); color:var(--text-2); }
.badge--brand { background:var(--brand-50); color:var(--brand-700); }
.r-excellent { background:#dcfce7; color:#15803d; } .r-great { background:#e7f5d8; color:#4d7c0f; }
.r-good { background:#fef9c3; color:#a16207; } .r-fair { background:#ffedd5; color:#c2410c; }
.r-improve { background:#fee2e2; color:#b91c1c; } .r-none { background:var(--surface-3); color:var(--text-3); }
html[data-theme="dark"] .r-excellent { background:#0d3b23; color:#4ade80; }
html[data-theme="dark"] .r-great { background:#1a3305; color:#a3e635; }
html[data-theme="dark"] .r-good { background:#3b2f05; color:#fde047; }
html[data-theme="dark"] .r-fair { background:#43210a; color:#fb923c; }
html[data-theme="dark"] .r-improve { background:#450d0d; color:#fca5a5; }

/* ============ กล่องข้อความ / แจ้งเตือน ============ */
.alert { padding:12px 15px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:13px;
  display:flex; gap:10px; align-items:flex-start; border:1px solid transparent; line-height:1.6; }
.alert--ok { background:var(--ok-soft); color:var(--ok); border-color:currentColor; }
.alert--warn { background:var(--warn-soft); color:var(--warn); border-color:currentColor; }
.alert--danger { background:var(--danger-soft); color:var(--danger); border-color:currentColor; }
.alert--info { background:var(--info-soft); color:var(--info); border-color:currentColor; }

#toasts {
  position:fixed; z-index:9000; display:flex; flex-direction:column; gap:9px;
  top:14px; right:14px; width:min(380px, calc(100vw - 28px));
}
.toast { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--brand-600);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); padding:12px 15px; font-size:13px;
  animation:slideIn .24s var(--ease); display:flex; gap:9px; align-items:flex-start; }
.toast--ok { border-left-color:var(--ok); } .toast--danger { border-left-color:var(--danger); }
.toast--warn { border-left-color:var(--warn); }
.toast .x { margin-left:auto; cursor:pointer; color:var(--text-3); font-weight:700; padding:0 4px; }
@keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }

/* ============ โมดัล ============ */
.modal-backdrop { position:fixed; inset:0; background:rgba(2,6,23,.55); backdrop-filter:blur(3px);
  z-index:8000; display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-width:640px; max-height:min(92vh, 92dvh); display:flex; flex-direction:column;
  animation:pop .2s var(--ease); overflow:hidden; }
.modal--wide { max-width:1000px; }
.modal__head { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center;
  gap:10px; flex-shrink:0; }
.modal__head h3 { font-size:15.5px; font-weight:700; flex:1; }
.modal__body { padding:20px; overflow-y:auto; overscroll-behavior:contain; }
.modal__foot { padding:13px 20px calc(13px + var(--safe-b)); border-top:1px solid var(--border);
  display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; flex-shrink:0; }
@keyframes pop { from { opacity:0; transform:scale(.97) translateY(8px); } to { opacity:1; transform:none; } }

/* ============ หน้าเข้าสู่ระบบ ============ */
.login-wrap {
  min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:18px;
  background:linear-gradient(135deg,#312e81 0%,#4338ca 45%,#0e7490 100%);
  overflow-y:auto;
}
.login-card { background:var(--surface); border-radius:22px; box-shadow:0 24px 70px rgba(0,0,0,.34);
  width:100%; max-width:430px; overflow:hidden; margin:auto; }
.login-card__head { padding:28px 28px 20px; text-align:center; }
.login-card__head .mark { width:58px; height:58px; margin:0 auto 12px; border-radius:18px;
  background:linear-gradient(135deg,var(--brand-600),var(--teal)); display:grid; place-items:center; font-size:29px; }
.login-card__head h1 { font-size:18.5px; font-weight:700; line-height:1.35; }
.login-card__head p { font-size:12.5px; color:var(--text-3); margin-top:4px; }
.tabs { display:flex; gap:6px; padding:0 24px 6px; }
.tab { flex:1; padding:10px; text-align:center; border-radius:10px; cursor:pointer; font-size:13px;
  font-weight:600; color:var(--text-2); background:var(--surface-3); border:none; font-family:inherit;
  transition:.16s; min-height:var(--tap); }
.tab.active { background:var(--brand-600); color:#fff; }
.login-card__body { padding:18px 28px 26px; }
.login-foot { text-align:center; padding:13px; font-size:11.5px; color:var(--text-3); background:var(--surface-2); }
.linkish { background:none; border:none; color:var(--brand-600); cursor:pointer; font-family:inherit;
  font-size:12.5px; font-weight:600; text-decoration:underline; padding:4px; }

/* ============ แบบประเมิน ============ */
.criteria-item { display:flex; align-items:center; gap:13px; padding:12px 14px; border:1px solid var(--border);
  border-radius:var(--radius-sm); margin-bottom:8px; background:var(--surface); transition:.16s; flex-wrap:wrap; }
.criteria-item:hover { border-color:var(--brand-200); box-shadow:var(--shadow-sm); }
.criteria-item.done { border-color:var(--ok); background:linear-gradient(90deg,var(--ok-soft) 0%,var(--surface) 14%); }
.criteria-item .no { width:26px; height:26px; border-radius:50%; background:var(--brand-600); color:#fff;
  display:grid; place-items:center; font-size:12px; font-weight:700; flex-shrink:0; }
.criteria-item .txt { flex:1 1 220px; min-width:0; font-size:13.5px; font-weight:500; }
.rate { display:flex; gap:5px; flex-shrink:0; }
.rate input { position:absolute; opacity:0; pointer-events:none; }
