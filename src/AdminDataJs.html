<script>
/* ============================================================
   AdminDataJs — ครู, ผู้ประเมิน, เวรประจำวันรายภาคเรียน, เกณฑ์, ตั้งค่า
   ============================================================ */

const PREFIX_LIST = ['นาย', 'นาง', 'นางสาว', 'ว่าที่ ร.ต.', 'ว่าที่ ร.ต.หญิง', 'ดร.'];
const LEVEL_LIST = ['ม.1', 'ม.2', 'ม.3', 'ม.4', 'ม.5', 'ม.6'];
const DAY_LIST = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์'];
const DUTY_POSITION_LIST = ['หัวหน้าเวร', 'รองหัวหน้าเวร', 'กรรมการเวร'];
const ROLE_LIST = [
  'รองผู้อำนวยการฝ่ายกิจการนักเรียน',
  'หัวหน้ากลุ่มบริหารงานกิจการนักเรียน',
  'หัวหน้าระดับชั้น',
  'หัวหน้าเวรประจำวัน'
];

/* ==================== ครูผู้รับการประเมิน ==================== */

App.pages.teachers = async function (container) {
  const rows = await api('apiListTeachers', App.session.token, '', '', true);
  Admin.cache.teachers = rows;

  container.innerHTML =
    '<div class="card">' +
      '<div class="card__head"><h3>🧑‍🏫 ทะเบียนครูผู้รับการประเมิน</h3>' +
        '<div class="spacer"></div>' +
        '<input type="text" id="tSearch" placeholder="🔍 ค้นหาชื่อครู" style="max-width:220px">' +
        '<button class="btn btn--ghost" onclick="Admin.importTeachers()">📥 นำเข้ารายชื่อ</button>' +
        '<button class="btn" onclick="Admin.editTeacher()">➕ เพิ่มครู</button></div>' +
      '<p class="card__desc">เวรประจำวันที่แสดงคือเวรของภาคเรียนปัจจุบัน (แก้ไขได้ที่เมนู "เวรประจำวันรายภาคเรียน")</p>' +
      '<div class="table-wrap"><table><thead><tr>' +
        '<th class="num">#</th><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>กลุ่มสาระ/ฝ่าย</th><th>ระดับชั้นที่ปรึกษา</th>' +
        '<th>เวรประจำวัน</th><th>อีเมล</th><th>สถานะ</th><th></th></tr></thead><tbody id="teacherBody">' +
        (rows.length ? rows.map(function (t, i) {
          return '<tr data-name="' + esc(t.name.toLowerCase()) + '">' +
            '<td class="num">' + (i + 1) + '</td><td class="small mono">' + esc(t.id) + '</td>' +
            '<td><b>' + esc(t.name) + '</b></td><td class="small">' + esc(t.department || '-') + '</td>' +
            '<td>' + esc(t.level || '-') + (t.room ? ' <span class="small muted">' + esc(t.room) + '</span>' : '') + '</td>' +
            '<td>' + (t.dutyDay ? esc(t.dutyDay) + (t.dutyFromRoster ? '' : ' <span class="badge badge--warn">ค่าเริ่มต้น</span>') : '<span class="muted">-</span>') + '</td>' +
            '<td class="small muted">' + esc(t.email || '-') + '</td>' +
            '<td><span class="badge ' + (t.status === 'ใช้งาน' ? 'badge--ok' : 'badge--muted') + '">' + esc(t.status) + '</span></td>' +
            '<td><div class="btn-row">' +
              '<button class="btn btn--ghost btn--sm" onclick="Admin.editTeacher(\'' + jsAttr(t.id) + '\')">แก้ไข</button>' +
              '<button class="btn btn--ghost btn--sm" onclick="Admin.teacherHistory(\'' + jsAttr(t.id) + '\')">ประวัติ</button>' +
              '<button class="btn btn--danger btn--sm" onclick="Admin.deleteTeacher(\'' + jsAttr(t.id) + '\',\'' + jsAttr(t.name) + '\')">ลบ</button>' +
            '</div></td></tr>';
        }).join('') : '<tr><td colspan="9">' + emptyState('🧑‍🏫', 'ยังไม่มีรายชื่อครู', 'กด "เพิ่มครู" หรือ "นำเข้ารายชื่อ"') + '</td></tr>') +
      '</tbody></table></div>' +
    '</div>';

  $('tSearch').oninput = debounce(function () {
    const k = this.value.toLowerCase();
    Array.prototype.slice.call(document.querySelectorAll('#teacherBody tr')).forEach(function (tr) {
      tr.style.display = !k || (tr.dataset.name || '').indexOf(k) !== -1 ? '' : 'none';
    });
  }, 200);
};

Admin.editTeacher = function (id) {
  const t = id ? (Admin.cache.teachers || []).filter(function (x) { return x.id === id; })[0] : null;
  const nameParts = t ? Admin.splitName(t.name) : { prefix: 'นาย', firstName: '', lastName: '' };

  modal({
    title: t ? '✏️ แก้ไขข้อมูลครู' : '➕ เพิ่มครูผู้รับการประเมิน',
    body:
      '<div class="grid grid-2">' +
        '<div class="field"><label>คำนำหน้า</label><select id="fPrefix">' +
          optionsHtml(PREFIX_LIST, nameParts.prefix) + '</select></div>' +
        '<div class="field"><label>กลุ่มสาระ/ฝ่าย</label><input type="text" id="fDept" value="' + esc(t ? t.department : '') + '"></div>' +
        '<div class="field"><label>ชื่อ *</label><input type="text" id="fFirst" value="' + esc(nameParts.firstName) + '"></div>' +
        '<div class="field"><label>นามสกุล *</label><input type="text" id="fLast" value="' + esc(nameParts.lastName) + '"></div>' +
        '<div class="field"><label>ระดับชั้นที่ปรึกษา</label><select id="fLevel">' +
          '<option value="">-- ไม่ระบุ --</option>' + optionsHtml(LEVEL_LIST, t ? t.level : '') + '</select></div>' +
        '<div class="field"><label>ห้องที่ปรึกษา</label><input type="text" id="fRoom" value="' + esc(t ? t.room : '') + '" placeholder="เช่น 1/3"></div>' +
        '<div class="field"><label>เวรประจำวัน (ค่าเริ่มต้น)</label><select id="fDay">' +
          '<option value="">-- ไม่ระบุ --</option>' + optionsHtml(DAY_LIST, t ? t.defaultDay : '') + '</select>' +
          '<div class="hint">ใช้เมื่อยังไม่มีตารางเวรของภาคเรียนนั้น</div></div>' +
        '<div class="field"><label>อีเมล</label><input type="email" id="fEmail" value="' + esc(t ? t.email : '') + '"></div>' +
        '<div class="field"><label>สถานะ</label><select id="fStatus">' +
          optionsHtml(['ใช้งาน', 'ไม่ใช้งาน'], t ? t.status : 'ใช้งาน') + '</select></div>' +
      '</div>',
    footer: '<button class="btn btn--ghost" data-close>ยกเลิก</button><button class="btn" id="btnSaveTeacher">💾 บันทึก</button>',
    onOpen: function (wrap, close) {
      wrap.querySelector('#btnSaveTeacher').onclick = async function () {
        try {
          await apiWithButton(this, 'apiSaveTeacher', App.session.token, {
            id: t ? t.id : '',
            prefix: wrap.querySelector('#fPrefix').value,
            firstName: wrap.querySelector('#fFirst').value.trim(),
            lastName: wrap.querySelector('#fLast').value.trim(),
            department: wrap.querySelector('#fDept').value.trim(),
            level: wrap.querySelector('#fLevel').value,
            room: wrap.querySelector('#fRoom').value.trim(),
            defaultDay: wrap.querySelector('#fDay').value,
            email: wrap.querySelector('#fEmail').value.trim(),
            status: wrap.querySelector('#fStatus').value
          });
          close();
          toast('บันทึกข้อมูลครูเรียบร้อย', 'ok');
          App.go('teachers');
        } catch (err) {
          toast(err.message, 'danger');
        }
      };
    }
  });
};

/**
 * แยกคำนำหน้า/ชื่อ/นามสกุล จากชื่อเต็ม
 * เทียบคำนำหน้าที่ยาวกว่าก่อน เพื่อไม่ให้ "นางสาว" ถูกตัดเหลือ "นาง"
 */
Admin.splitName = function (fullName) {
  let prefix = '';
  PREFIX_LIST.slice().sort(function (a, b) { return b.length - a.length; })
    .forEach(function (p) {
      if (!prefix && fullName.indexOf(p) === 0) prefix = p;
    });
  const rest = fullName.substring(prefix.length).trim().split(/\s+/);
  return { prefix: prefix || 'นาย', firstName: rest[0] || '', lastName: rest.slice(1).join(' ') || '' };
};

Admin.deleteTeacher = async function (id, name) {
  const yes = await confirmDialog({
    title: '🗑️ ลบข้อมูลครู', message: 'ต้องการลบ "' + name + '" ออกจากทะเบียนใช่หรือไม่?',
    warning: 'ลบได้เฉพาะครูที่ยังไม่มีผลการประเมิน หากมีแล้วให้เปลี่ยนสถานะเป็น "ไม่ใช้งาน" แทน',
    confirmText: 'ลบ', danger: true
  });
  if (!yes) return;
  try {
    const res = await rpc('apiDeleteTeacher', App.session.token, id);
    if (!res.success) throw new Error(res.message);
    toast(res.message, 'ok');
    App.go('teachers');
  } catch (err) { toast(err.message, 'danger'); }
};

          '</tr></thead><tbody>' + d.trend.map(function (t) {

        d.records.map(function (r) {

            '<td class="num">' + num(r.average) + '</td>' +
            '<td><span class="badge ' + ratingClass(r.rating) + '">' + esc(r.rating) + '</span></td>' +

        }).join('') + '</tbody></table></div>',
      footer: '<button class="btn btn--ghost" data-close>ปิด</button>'
    });
  } catch (err) { toast(err.message, 'danger'); }
};

Admin.importTeachers = function () {
  const state = { file: null, preview: null, updateExisting: false };

  const m = modal({
    wide: true,
    title: '📥 นำเข้ารายชื่อครู',
    body:
      '<div class="tabs" style="padding:0 0 12px">' +
        '<button class="tab active" id="impTabFile">📄 อัปโหลดไฟล์ CSV / Excel</button>' +
        '<button class="tab" id="impTabPaste">📋 วางข้อความ</button>' +
      '</div>' +

      '<div id="impFilePane">' +
        '<div class="alert alert--info"><span>💡</span><span>' +
          'ยังไม่มีไฟล์? ดาวน์โหลดเทมเพลตที่กรอกง่ายไปใช้ได้เลย ' +
          'ระบบรองรับไฟล์ <b>.xlsx .xls .ods .csv .tsv</b> และอ่านภาษาไทยจาก Excel ได้ทั้งแบบ UTF-8 และแบบเดิม' +
        '</span></div>' +
        '<div class="btn-row" style="margin-bottom:14px">' +
          '<button class="btn btn--soft" id="btnTplXlsx">⬇️ ดาวน์โหลดเทมเพลต Excel</button>' +
          '<button class="btn btn--ghost" id="btnTplCsv">⬇️ ดาวน์โหลดเทมเพลต CSV</button>' +
        '</div>' +

        '<div id="dropZone" style="border:2px dashed var(--border-2);border-radius:var(--radius);' +
          'padding:26px 18px;text-align:center;cursor:pointer;transition:.16s;background:var(--surface-2)">' +
          '<div style="font-size:34px;margin-bottom:6px">📁</div>' +
          '<div style="font-weight:600" id="dropText">ลากไฟล์มาวางที่นี่ หรือกดเพื่อเลือกไฟล์</div>' +
          '<div class="small muted" style="margin-top:4px">ขนาดไม่เกิน 6 MB · สูงสุด 2,000 แถว</div>' +
          '<input type="file" id="impFile" accept=".csv,.tsv,.txt,.xlsx,.xls,.ods" style="display:none">' +
        '</div>' +

        '<label class="checkbox" style="margin-top:12px"><input type="checkbox" id="impUpdate">' +
          '<span>อัปเดตข้อมูลเดิมถ้าพบชื่อหรือรหัสครูซ้ำ' +
          '<div class="small muted">ถ้าไม่ติ๊ก ระบบจะข้ามรายการที่ซ้ำ</div></span></label>' +

        '<div id="impResult"></div>' +
      '</div>' +

      '<div id="impPastePane" class="hidden">' +
        '<div class="alert alert--info"><span>💡</span><span>คัดลอกจาก Excel มาวางได้เลย หนึ่งบรรทัดต่อหนึ่งคน<br>' +
          '<b>คำนำหน้า | ชื่อ | นามสกุล | ระดับชั้น | เวรประจำวัน | อีเมล</b> (สามคอลัมน์แรกจำเป็น)</span></div>' +
        '<div class="field"><textarea id="importText" rows="9" ' +
          'placeholder="นาย&#9;สมชาย&#9;ใจดี&#9;ม.1&#9;จันทร์&#9;somchai@school.ac.th"></textarea></div>' +
        '<button class="btn" id="btnImportPaste">📥 นำเข้าจากข้อความ</button>' +
      '</div>',
    footer: '<button class="btn btn--ghost" data-close>ปิด</button>' +
      '<button class="btn btn--ok hidden" id="btnDoImport">✅ นำเข้าข้อมูล</button>',
    onOpen: function (wrap, close) {
      const $$ = function (sel) { return wrap.querySelector(sel); };

      $$('#impTabFile').onclick = function () {
        this.classList.add('active'); $$('#impTabPaste').classList.remove('active');
        $$('#impFilePane').classList.remove('hidden'); $$('#impPastePane').classList.add('hidden');
        $$('#btnDoImport').classList.toggle('hidden', !state.preview);
      };
      $$('#impTabPaste').onclick = function () {
        this.classList.add('active'); $$('#impTabFile').classList.remove('active');
        $$('#impPastePane').classList.remove('hidden'); $$('#impFilePane').classList.add('hidden');
        $$('#btnDoImport').classList.add('hidden');
      };

      // ---- ดาวน์โหลดเทมเพลต ----
      const downloadTemplate = async function (button, format) {
        try {
          const t = await apiWithButton(button, 'apiDownloadTeacherTemplate', App.session.token, format);
          if (!downloadBase64(t.base64, t.name, t.mimeType)) {
            toast('เบราว์เซอร์ไม่อนุญาตให้ดาวน์โหลดจากหน้าต่างนี้ กรุณาเปิดระบบผ่านลิงก์เว็บแอป', 'warn', 8000);
          } else {
            toast('ดาวน์โหลดเทมเพลตแล้ว: ' + t.name, 'ok');
          }
        } catch (err) { toast(err.message, 'danger'); }
      };
      $$('#btnTplXlsx').onclick = function () { downloadTemplate(this, 'xlsx'); };
      $$('#btnTplCsv').onclick = function () { downloadTemplate(this, 'csv'); };

      // ---- เลือก/ลากไฟล์ ----
      const zone = $$('#dropZone');
      const input = $$('#impFile');
      zone.onclick = function () { input.click(); };
      zone.ondragover = function (e) {
        e.preventDefault();
        zone.style.borderColor = 'var(--brand-500)';
        zone.style.background = 'var(--brand-50)';
      };
      zone.ondragleave = function () {
        zone.style.borderColor = 'var(--border-2)';
        zone.style.background = 'var(--surface-2)';
      };
      zone.ondrop = function (e) {
        e.preventDefault();
        zone.ondragleave();
        if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
      };
      input.onchange = function () { if (this.files[0]) handleFile(this.files[0]); };
      $$('#impUpdate').onchange = function () {
        state.updateExisting = this.checked;
        if (state.file) handleFile(state.file);
      };

      function handleFile(file) {
        if (file.size > 6 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 6 MB', 'warn'); return; }
        state.file = file;
        $$('#dropText').textContent = '📄 ' + file.name;
        $$('#impResult').innerHTML = '<div class="page-loading"><span class="spinner spinner--dark"></span>' +
          '<span>กำลังอ่านไฟล์...</span></div>';
        $$('#btnDoImport').classList.add('hidden');

        const reader = new FileReader();
        reader.onerror = function () {
          $$('#impResult').innerHTML = '<div class="alert alert--danger"><span>⚠️</span><span>อ่านไฟล์ไม่สำเร็จ</span></div>';
        };
        reader.onload = async function () {
          try {
            const base64 = String(reader.result).split(',')[1];
            const preview = await api('apiPreviewTeacherImport', App.session.token,
              { fileName: file.name, mimeType: file.type, base64: base64 },
              { updateExisting: state.updateExisting });
            state.preview = preview;
            renderPreview(preview);
          } catch (err) {
            state.preview = null;
            $$('#impResult').innerHTML = '<div class="alert alert--danger"><span>⚠️</span><span>' +
              esc(err.message).replace(/\n/g, '<br>') + '</span></div>';
          }
        };
        reader.readAsDataURL(file);
      }

      function renderPreview(p) {
        const s = p.summary;
        const badge = function (label, count, cls) {
          return count ? '<span class="badge ' + cls + '">' + label + ' ' + count + '</span> ' : '';
        };
        const statusBadge = {
          'new': '<span class="badge badge--ok">เพิ่มใหม่</span>',
          'update': '<span class="badge badge--info">อัปเดต</span>',
          'duplicate': '<span class="badge badge--muted">ข้าม</span>',
          'error': '<span class="badge badge--danger">ผิดพลาด</span>'
        };

        $$('#impResult').innerHTML =
          '<div class="card" style="margin-top:14px;box-shadow:none;border-color:var(--border)">' +
            '<div class="card__head"><h3>ตรวจสอบข้อมูลก่อนนำเข้า</h3><div class="spacer"></div>' +
              badge('เพิ่มใหม่', s.new, 'badge--ok') + badge('อัปเดต', s.update, 'badge--info') +
              badge('ข้าม', s.duplicate, 'badge--muted') + badge('ผิดพลาด', s.error, 'badge--danger') +
            '</div>' +
            (p.matchedColumns.length
              ? '<p class="small muted">จับคู่คอลัมน์ได้: ' +
                p.matchedColumns.map(function (c) { return esc(c.column); }).join(', ') +
                (p.unknownColumns.length ? ' · <span style="color:var(--warn)">ไม่รู้จัก (ข้าม): ' +
                  p.unknownColumns.map(esc).join(', ') + '</span>' : '') + '</p>'
              : '<p class="small muted">ไม่พบหัวตาราง — อ่านตามลำดับคอลัมน์มาตรฐาน</p>') +
            '<div class="table-wrap scroll-y" style="max-height:340px"><table><thead><tr>' +
              '<th>แถว</th><th>ชื่อ-นามสกุล</th><th>ระดับชั้น</th><th>เวร</th><th>สถานะ</th><th>หมายเหตุ</th>' +
            '</tr></thead><tbody>' +
              p.rows.map(function (r) {
                return '<tr><td class="num">' + r.line + '</td>' +
                  '<td><b>' + esc(r.prefix + r.firstName + ' ' + r.lastName) + '</b></td>' +
                  '<td>' + esc(r.level || '-') + '</td><td>' + esc(r.day || '-') + '</td>' +
                  '<td>' + (statusBadge[r.status_] || '') + '</td>' +
                  '<td class="small muted">' + esc(r.message || '') + '</td></tr>';
              }).join('') +
            '</tbody></table></div>' +
          '</div>';

        const canImport = (s.new + s.update) > 0;
        $$('#btnDoImport').classList.toggle('hidden', !canImport);
        $$('#btnDoImport').textContent = '✅ นำเข้า ' + (s.new + s.update) + ' รายการ';
      }

      // ---- นำเข้าจริง ----
      $$('#btnDoImport').onclick = async function () {
        if (!state.preview) return;
        try {
          const res = await apiWithButton(this, 'apiCommitTeacherImport', App.session.token, {
            rows: state.preview.rows,
            updateExisting: state.updateExisting,
            fileName: state.preview.fileName
          });
          close();
          toast('นำเข้าเรียบร้อย: เพิ่ม ' + res.added + ' คน' +
            (res.updated ? ', อัปเดต ' + res.updated + ' คน' : ''), 'ok', 7000);
          if (res.skipped && res.skipped.length) {
            toast('ข้าม ' + res.skipped.length + ' รายการ: ' + res.skipped.slice(0, 3).join(', ') +
              (res.skipped.length > 3 ? ' ...' : ''), 'warn', 9000);
          }
          App.go('teachers');
        } catch (err) { toast(err.message, 'danger'); }
      };

      // ---- นำเข้าจากข้อความ (แบบเดิม) ----
      $$('#btnImportPaste').onclick = async function () {
        try {
          const res = await apiWithButton(this, 'apiImportTeachers', App.session.token,
            $$('#importText').value);
          close();
          toast('นำเข้าเรียบร้อย: เพิ่ม ' + res.added + ' คน', 'ok');
          if (res.skipped && res.skipped.length) {
            toast('ข้าม ' + res.skipped.length + ' รายการ', 'warn');
          }
          App.go('teachers');
        } catch (err) { toast(err.message, 'danger'); }
      };
    }
  });
  return m;
};

Admin.onRoleChange = function (preset) {
  const role = document.getElementById('gRole').value;

  if (role === 'หัวหน้าระดับชั้น') {
    field.style.display = '';
    label.textContent = 'ระดับชั้นที่รับผิดชอบ *';
    select.innerHTML = '<option value="">-- เลือกระดับชั้น --</option>' + optionsHtml(LEVEL_LIST, preset || '');

    field.style.display = '';

Admin.editDuty = function (dutyId, presetTeacherId) {
  const data = Admin.cache.duty;
  const row = dutyId ? data.rows.filter(function (r) { return r.id === dutyId; })[0] : null;
  // ใช้รายชื่อครูของภาคเรียนนี้โดยเฉพาะ (เฉพาะที่ยังใช้งานอยู่)
  const teachers = (Admin.cache.dutyTeachers && Admin.cache.dutyTeachersTerm === data.year + '/' + data.semester)
    ? Admin.cache.dutyTeachers : null;

  const openModal = function (teacherList) {
    const selectableTeachers = row
      ? teacherList
      : teacherList.filter(function (t) {
          return !data.rows.some(function (r) { return r.teacherId === t.id; });
        });

    modal({
      title: row ? '✏️ แก้ไขรายการเวร' : '➕ เพิ่มรายการเวร — ' + semesterLabel(data.semester) + '/' + data.year,
      body:
        '<div class="grid grid-2">' +
          '<div class="field" style="grid-column:1/-1"><label>ครู *</label><select id="uTeacher"' +
            (row ? ' disabled' : '') + '>' +
            '<option value="">-- เลือกครู --</option>' +
            optionsHtml(selectableTeachers, row ? row.teacherId : (presetTeacherId || ''), function (t) {
              return { value: t.id, label: t.name + (t.level ? ' (' + t.level + ')' : '') };
            }) + '</select>' +
            (row ? '<div class="hint">ต้องการเปลี่ยนครู ให้ลบรายการนี้แล้วเพิ่มใหม่</div>' : '') + '</div>' +
          '<div class="field"><label>เวรประจำวัน *</label><select id="uDay">' +
            '<option value="">-- เลือกวัน --</option>' +
            optionsHtml(DAY_LIST, row ? row.day : '', function (d) { return { value: d, label: 'วัน' + d }; }) + '</select></div>' +
          '<div class="field"><label>บทบาทในเวร</label><select id="uPosition">' +
            optionsHtml(DUTY_POSITION_LIST, row ? row.position : 'กรรมการเวร') + '</select></div>' +
          '<div class="field"><label>จุดปฏิบัติหน้าที่</label>' +
            '<input type="text" id="uLocation" value="' + esc(row ? row.location : '') + '" placeholder="เช่น ประตูหน้าโรงเรียน"></div>' +
          '<div class="field"><label>ระดับชั้นที่ดูแล</label><select id="uLevel">' +
            '<option value="">-- ไม่ระบุ --</option>' + optionsHtml(LEVEL_LIST, row ? row.level : '') + '</select></div>' +
          '<div class="field"><label>เวลาเริ่ม</label><input type="time" id="uStart" value="' + esc(row ? row.startTime : '') + '"></div>' +
          '<div class="field"><label>เวลาสิ้นสุด</label><input type="time" id="uEnd" value="' + esc(row ? row.endTime : '') + '"></div>' +
          '<div class="field" style="grid-column:1/-1"><label>หมายเหตุ</label>' +
            '<input type="text" id="uNote" value="' + esc(row ? row.note : '') + '"></div>' +
        '</div>',
      footer: '<button class="btn btn--ghost" data-close>ยกเลิก</button><button class="btn" id="btnSaveDuty">💾 บันทึก</button>',
      onOpen: function (wrap, close) {
        wrap.querySelector('#btnSaveDuty').onclick = async function () {
          try {
            await apiWithButton(this, 'apiSaveDuty', App.session.token, {
              id: row ? row.id : '',
              year: data.year, semester: data.semester,
              teacherId: row ? row.teacherId : wrap.querySelector('#uTeacher').value,
              day: wrap.querySelector('#uDay').value,
              position: wrap.querySelector('#uPosition').value,
              location: wrap.querySelector('#uLocation').value.trim(),
              level: wrap.querySelector('#uLevel').value,
              startTime: wrap.querySelector('#uStart').value,
              endTime: wrap.querySelector('#uEnd').value,
              note: wrap.querySelector('#uNote').value.trim()
            });
            close();
            toast('บันทึกรายการเวรเรียบร้อย', 'ok');
            App.go('duty');
          } catch (err) { toast(err.message, 'danger'); }
        };
      }
    });
  };

  if (teachers) openModal(teachers);
  else {
    api('apiListTeachers', App.session.token, data.year, data.semester, false).then(function (list) {
      Admin.cache.dutyTeachers = list;
      Admin.cache.dutyTeachersTerm = data.year + '/' + data.semester;
      openModal(list);
    }).catch(function (err) { toast(err.message, 'danger'); });
  }
};

  const hasRows = data.rows.length > 0;

    title: '🪄 สร้างตารางเวรจากค่าเริ่มต้น',
    message: 'สร้างรายการเวรของ ' + semesterLabel(data.semester) + '/' + data.year +
      ' จากคอลัมน์ "เวรประจำวัน (ค่าเริ่มต้น)" ในทะเบียนครูใช่หรือไม่?',
    warning: hasRows ? 'ภาคเรียนนี้มีตารางเวรอยู่แล้ว ' + data.rows.length +
      ' รายการ — ระบบจะลบของเดิมแล้วสร้างใหม่ทั้งหมด' : '',
    confirmText: 'สร้างตารางเวร'
  });
  if (!yes) return;
  try {
    const res = await rpc('apiSeedDuty', App.session.token, data.year, data.semester, hasRows);
    if (!res.success) throw new Error(res.message);
    toast(res.message, 'ok');
    App.go('duty');
  } catch (err) { toast(err.message, 'danger'); }
};

        data.criteria.map(function (c) {
          return '<tr><td class="num"><b>' + c.id + '</b></td>' +
            '<td><b>' + esc(c.name) + '</b>' + (c.description ? '<div class="small muted">' + esc(c.description) + '</div>' : '') + '</td>' +
            '<td class="small">' + c.roles.map(function (k) {
              const found = data.roles.filter(function (r) { return r.key === k; })[0];
              return '<span class="badge badge--muted">' + esc(found ? found.name : k) + '</span>';
            }).join(' ') + '</td>' +
            '<td class="num">' + c.weight + '%</td>' +
            '<td><span class="badge ' + (c.status === 'ใช้งาน' ? 'badge--ok' : 'badge--muted') + '">' + esc(c.status) + '</span></td>' +

        }).join('') + '</tbody></table></div>' +
    '</div>';
};

Admin.editCriteria = function (id) {
  const data = Admin.cache.criteria;
  const c = id ? data.criteria.filter(function (x) { return x.id === id; })[0] : null;
  const nextId = data.criteria.reduce(function (max, x) { return Math.max(max, x.id); }, 0) + 1;

  modal({
    title: c ? '✏️ แก้ไขเกณฑ์ข้อ ' + c.id : '➕ เพิ่มเกณฑ์การประเมิน',
    body:
      '<div class="field"><label>ข้อที่ *</label>' +
        '<input type="number" id="kId" min="1" max="' + data.maxCriteria + '" value="' + (c ? c.id : nextId) + '"' +
        (c ? ' readonly' : '') + '></div>' +
      '<div class="field"><label>ชื่อเกณฑ์ *</label><input type="text" id="kName" value="' + esc(c ? c.name : '') + '"></div>' +
      '<div class="field"><label>คำอธิบายเพิ่มเติม</label><input type="text" id="kDesc" value="' + esc(c ? c.description : '') + '"></div>' +
      '<div class="field"><label>ผู้มีสิทธิ์ประเมินข้อนี้ *</label>' +
        data.roles.map(function (r) {
          const checked = c ? c.roles.indexOf(r.key) !== -1 : true;
          return '<label class="checkbox"><input type="checkbox" class="kRole" value="' + esc(r.key) + '"' +
            (checked ? ' checked' : '') + '><span>' + esc(r.name) + '</span></label>';
        }).join('') + '</div>' +
      '<div class="grid grid-2">' +
        '<div class="field"><label>น้ำหนัก (%)</label><input type="number" id="kWeight" min="1" max="100" value="' + (c ? c.weight : 10) + '"></div>' +
        '<div class="field"><label>สถานะ</label><select id="kStatus">' +
          optionsHtml(['ใช้งาน', 'ไม่ใช้งาน'], c ? c.status : 'ใช้งาน') + '</select></div>' +
      '</div>',
    footer: '<button class="btn btn--ghost" data-close>ยกเลิก</button><button class="btn" id="btnSaveCriteria">💾 บันทึก</button>',
    onOpen: function (wrap, close) {
      wrap.querySelector('#btnSaveCriteria').onclick = async function () {
        const roles = Array.prototype.slice.call(wrap.querySelectorAll('.kRole:checked')).map(function (x) { return x.value; });
        try {
          await apiWithButton(this, 'apiSaveCriteria', App.session.token, {
            id: Number(wrap.querySelector('#kId').value),
            name: wrap.querySelector('#kName').value.trim(),
            description: wrap.querySelector('#kDesc').value.trim(),
            roles: roles,
            weight: Number(wrap.querySelector('#kWeight').value),
            status: wrap.querySelector('#kStatus').value
          });
          close();
          toast('บันทึกเกณฑ์เรียบร้อย', 'ok');
          App.go('criteria');
        } catch (err) { toast(err.message, 'danger'); }
      };
    }
  });
};
