<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: #fff; border-radius: 16px; padding: 35px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; }
    .icon { font-size: 48px; margin-bottom: 10px; }
    h2 { color: #2e7d32; font-size: 20px; margin-bottom: 5px; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 25px; }
    .form-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; color: #555; margin-bottom: 6px; }
    select, input[type="password"] { width: 100%; padding: 11px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; font-family: 'Sarabun', sans-serif; transition: all 0.3s; }
    select:focus, input:focus { outline: none; border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46,125,50,0.1); }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: 'Sarabun', sans-serif; transition: all 0.3s; }
    .btn-eval { background: linear-gradient(135deg, #2e7d32, #388e3c); color: #fff; }
    .btn-eval:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(46,125,50,0.3); }
    .btn-eval:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }
    .error { color: #c62828; font-size: 13px; margin-top: 12px; display: none; background: #ffebee; padding: 8px 12px; border-radius: 8px; }
    .error.show { display: block; }
    .loading { display: none; color: #2e7d32; font-size: 14px; margin-top: 12px; }
    .loading.show { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="icon">📝</div>
    <h2>เข้าสู่ระบบผู้ประเมิน</h2>
    <p class="subtitle">ระบบประเมินผลการปฏิบัติงานครู</p>

    <div class="form-group">
      <label>👤 เลือกชื่อผู้ประเมิน</label>
      <select id="evalName">
        <option value="">-- กำลังโหลด... --</option>
      </select>
    </div>

    <div class="form-group">
      <label>🔑 รหัสผ่าน</label>
      <input type="password" id="evalPass" placeholder="กรอกรหัสผ่านที่ได้จาก Admin" onkeypress="if(event.key==='Enter') doLogin()">
    </div>

    <button class="btn btn-eval" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>

    <div class="error" id="errorMsg"></div>
    <div class="loading" id="loading">⏳ กำลังตรวจสอบ...</div>
  </div>

  <script>
    // โหลดรายชื่อผู้ประเมิน
    google.script.run
      .withSuccessHandler(function(list) {
        var select = document.getElementById('evalName');
        select.innerHTML = '<option value="">-- เลือกผู้ประเมิน --</option>';
        list.forEach(function(e) {
          var opt = document.createElement('option');
          opt.value = e.name;
          opt.textContent = e.name + ' (' + e.role + (e.scope ? ' - ' + e.scope : '') + ')';
          select.appendChild(opt);
        });
      })
      .getEvaluatorListForLogin();

    function doLogin() {
      var name = document.getElementById('evalName').value;
      var pass = document.getElementById('evalPass').value.trim();

      if (!name) { showError('กรุณาเลือกชื่อผู้ประเมิน'); return; }
      if (!pass) { showError('กรุณากรอกรหัสผ่าน'); return; }

      document.getElementById('loginBtn').disabled = true;
      document.getElementById('loading').classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');

      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('loading').classList.remove('show');
          if (result.success) {
            google.script.host.close();
            google.script.run.showEvaluationForm();
          } else {
            showError(result.message);
            document.getElementById('loginBtn').disabled = false;
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').classList.remove('show');
          showError('เกิดข้อผิดพลาด: ' + err.message);
          document.getElementById('loginBtn').disabled = false;
        })
        .verifyEvaluatorPassword(name, pass);
    }

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = '❌ ' + msg;
      el.classList.add('show');
    }
  </script>
</body>
</html>
